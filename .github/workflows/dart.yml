name: Deploy App

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.push_release.outputs.tag_name }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: rymndhng/release-on-push-action@v0.28.0
        id: push_release
        with:
          bump_version_scheme: patch
          tag_prefix: v
      - run: echo "VAPID_KEY=${{ secrets.VAPID_KEY }}" > .env # bundled as a Flutter asset -- the build fails if it's missing entirely

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
      - run: echo -e 'storePassword=${{secrets.KEYSTORE_PASSWORD}}\nkeyPassword=${{secrets.KEYSTORE_PASSWORD}}\nkeyAlias=upload\nstoreFile=/tmp/upload-keystore.jks' > android/key.properties
      - run: flutter build apk --pub --suppress-analytics --dart-define=API_HOST=${{ vars.API_HOST }} --build-name=`echo ${{ steps.push_release.outputs.tag_name }}` --build-number=`echo ${{ steps.push_release.outputs.tag_name }} | tr -d v.`

      - name: Get release
        id: get_release
        uses: cardinalby/git-get-release-action@v1
        with:
          tag: ${{ steps.push_release.outputs.tag_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ steps.push_release.outputs.tag_name }}
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest
    needs: build
    environment: main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - run: echo "VAPID_KEY=${{ secrets.VAPID_KEY }}" > .env # bundled as a Flutter asset -- the build fails if it's missing entirely

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config libsecret-1-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Linux
        run: |
          TAG=${{ needs.build.outputs.tag_name }}
          flutter build linux \
            --pub \
            --suppress-analytics \
            --dart-define=API_HOST=${{ vars.API_HOST }} \
            --build-name="${TAG#v}" \
            --build-number="$(echo $TAG | tr -d v.)"

      - name: Package tarball
        run: tar -czf wuxia-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Package .deb
        run: |
          VERSION="${{ needs.build.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          PKG_DIR=wuxia-deb
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/opt/wuxia" "$PKG_DIR/usr/bin" \
            "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/512x512/apps"

          cp -r build/linux/x64/release/bundle/* "$PKG_DIR/opt/wuxia/"
          ln -s /opt/wuxia/wuxia "$PKG_DIR/usr/bin/wuxia"
          cp web/icons/Icon-512.png "$PKG_DIR/usr/share/icons/hicolor/512x512/apps/com.hubble.wuxia.png"
          cp linux/packaging/com.hubble.wuxia.desktop "$PKG_DIR/usr/share/applications/com.hubble.wuxia.desktop"

          # dpkg-shlibdeps computes the real runtime library dependencies
          # from what the build actually links against, rather than a
          # hand-maintained guess that can silently drift from it.
          mkdir -p "$PKG_DIR/debian"
          printf 'Source: wuxia\nPackage: wuxia\n' > "$PKG_DIR/debian/control"
          DEPENDS=$(cd "$PKG_DIR" && dpkg-shlibdeps --ignore-missing-info -O opt/wuxia/wuxia opt/wuxia/lib/*.so 2>/dev/null | sed -n 's/^shlibs:Depends=//p')
          rm -rf "$PKG_DIR/debian"

          VERSION="$VERSION" DEPENDS="$DEPENDS" envsubst '${VERSION} ${DEPENDS}' < linux/packaging/control.template > "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKG_DIR" wuxia-linux.deb

      - name: Upload Linux build to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wuxia-linux.tar.gz
            wuxia-linux.deb
          tag_name: ${{ needs.build.outputs.tag_name }}
