server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # main.dart.wasm/canvaskit.wasm are a few MB uncompressed -- without
    # this they're served raw and the page sits blank while they download.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/wasm
        application/javascript
        text/javascript
        application/json
        text/css
        image/svg+xml;

    location ~* \.mjs$ {
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
